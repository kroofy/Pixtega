listen_address = "0.0.0.0:8080"
path_prefix = "/images"

allowed_widths = [320, 640, 1280, 1920]

max_download_bytes = 52428800
max_source_megapixels = 100
download_timeout_ms = 10000
# Whole-request deadline. Waiting for a max_concurrent_derivations permit,
# the source fetch (download_timeout_ms, which must not exceed this), and
# image processing all spend from this one budget; expiry is a
# non-cacheable 504, possibly before the fetch or processing even starts.
# Optional; defaults to 9000. Keep it below any
# host kill deadline (e.g. an AWS Lambda function timeout) so the service
# answers before the host does. A timed-out encode cannot be cancelled and
# keeps its derivation slot until libvips returns.
request_timeout_ms = 30000
max_redirects = 3
max_concurrent_derivations = 8
# Cache policy for 200s. Recommended: give every source image a unique,
# content-derived name (for example a hash, photos/example.6acca6c1.jpg) and
# never overwrite it. A path then always means the same bytes, so it can be
# cached for one year and marked immutable, as below. If source paths can be
# overwritten, set success_immutable = false and choose a shorter
# success_ttl_seconds (1..=31536000): a changed image is only picked up
# once that lifetime runs out.
success_ttl_seconds = 31536000
success_immutable = true
not_found_ttl_seconds = 60

[formats.webp]
default_quality = 82
allowed_qualities = [60, 72, 90]

[formats.avif]
default_quality = 55
allowed_qualities = [40, 65]

[formats.jpeg]
default_quality = 85
allowed_qualities = [70, 92]

[[sources]]
mount = "public"
key_prefix = "media"
transport = "http"
# Pin base_url to an origin you control, over HTTPS wherever it crosses an
# untrusted network. Private, loopback, link-local, and metadata-style
# hosts are rejected at startup unless the source sets
# `allow_private_destinations = true` (local development fixtures only).
base_url = "https://images.example.test"

[[sources]]
mount = "fixtures"
key_prefix = ""
transport = "filesystem"
root = "./fixtures"

[[sources]]
mount = "archive"
key_prefix = "originals"
transport = "s3"
bucket = "example-image-bucket"
region = "us-east-1"
