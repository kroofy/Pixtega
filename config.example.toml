listen_address = "0.0.0.0:8080"
path_prefix = "/images"

allowed_widths = [320, 640, 1280, 1920]

max_download_bytes = 52428800
max_source_megapixels = 100
download_timeout_ms = 10000
# Whole-request deadline. The source fetch (download_timeout_ms, which must
# not exceed this) and image processing spend from this one budget; expiry
# is a non-cacheable 504. Optional; defaults to 9000. Keep it below any
# host kill deadline (e.g. an AWS Lambda function timeout) so the service
# answers before the host does. A timed-out encode cannot be cancelled and
# keeps its derivation slot until libvips returns.
request_timeout_ms = 30000
max_redirects = 3
max_concurrent_derivations = 8
unversioned_success_ttl_seconds = 3600
not_found_ttl_seconds = 60

# How the `v` query parameter is treated. Optional; defaults to "accept".
#   accept - a valid `v` upgrades the response to year-long immutable caching
#   ignore - `v` is parsed and validated as usual, but the response is served
#            with unversioned_success_ttl_seconds as if no `v` were present
#   reject - any `v` is a 400, like any other unknown query parameter
#            (for deployments that version sources by path instead)
# Any other value is a startup error.
version_token = "accept"

[formats.webp]
default_quality = 82
allowed_qualities = [60, 72, 90]

[formats.avif]
default_quality = 55
allowed_qualities = [40, 65]

[formats.jpeg]
default_quality = 85
allowed_qualities = [70, 92]

[[sources]]
mount = "public"
key_prefix = "media"
transport = "http"
# Pin base_url to an origin you control, over HTTPS wherever it crosses an
# untrusted network. Private, loopback, link-local, and metadata-style
# hosts are rejected at startup unless the source sets
# `allow_private_destinations = true` (local development fixtures only).
base_url = "https://images.example.test"

[[sources]]
mount = "fixtures"
key_prefix = ""
transport = "filesystem"
root = "./fixtures"

[[sources]]
mount = "archive"
key_prefix = "originals"
transport = "s3"
bucket = "example-image-bucket"
region = "us-east-1"
