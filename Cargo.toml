[package]
name = "pixtega"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "On-demand image derivation service: fetches a source image, derives a bounded variant, returns cacheable bytes."
repository = "https://github.com/kroofy/Pixtega"
homepage = "https://pixtega.com"
documentation = "https://pixtega.com/docs/getting-started.html"
readme = "README.md"

[dependencies]
async-trait = "0.1"
axum = "0.8"
# default-features dropped `sso` (sha1 0.10 → block-buffer 0.10.4, GHSA-qwgh-2vcv-g2f7).
# Env, profile, process, and IMDS/task-role credentials still work.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process"] }
# sigv4a dropped: p256 0.13 → digest 0.10 → the same block-buffer 0.10.4. Regular SigV4 is enough for GetObject.
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
futures-util = "0.3"
libc = "0.2"
libvips = "=2.3.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
url = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
rcgen = "0.14"
rustls = "0.23"
rustls-pemfile = "2"
tempfile = "3"
tokio-rustls = "0.26"

[lib]
name = "pixtega"
path = "src/lib.rs"

[[bin]]
name = "pixtega"
path = "src/main.rs"

# crc-fast 1.10.0 pins digest 0.10 (block-buffer 0.10.4). Drop when crc-fast
# depends on digest >= 0.11 (or aws-smithy-checksums stops needing crc-fast).
[patch.crates-io]
crc-fast = { path = "vendor/crc-fast" }
