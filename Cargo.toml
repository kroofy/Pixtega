[package]
name = "pixtega"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "On-demand image derivation service: fetches a source image, derives a bounded variant, returns cacheable bytes."
repository = "https://github.com/kroofy/Pixtega"
homepage = "https://pixtega.com"
documentation = "https://pixtega.com/docs/getting-started.html"
readme = "README.md"

[dependencies]
async-trait = "0.1"
axum = "0.8"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
futures-util = "0.3"
libc = "0.2"
libvips = "=2.3.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
url = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
rcgen = "0.14"
rustls = "0.23"
rustls-pemfile = "2"
tempfile = "3"
tokio-rustls = "0.26"

[lib]
name = "pixtega"
path = "src/lib.rs"

[[bin]]
name = "pixtega"
path = "src/main.rs"
