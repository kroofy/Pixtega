# Release pipeline. Cutting a release:
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# On a v* tag this workflow:
#   1. builds and pushes multi-arch (linux/amd64 + linux/arm64) OCI images
#      to ghcr.io/kroofy/pixtega
#        - Dockerfile        -> X.Y.Z, X.Y, latest
#        - Dockerfile.lambda -> X.Y.Z-lambda, lambda
#      Each architecture builds natively on its own runner (no QEMU for
#      the Rust + libvips compile); the per-arch digests are then joined
#      into one manifest list per tag with `docker buildx imagetools create`.
#   2. builds the release binary (x86_64 only; dynamically linked against
#      Ubuntu 26.04 libvips; the container image is the recommended
#      distribution), packages it as a tarball with SHA256SUMS,
#   3. publishes the npm packages from js/ — `pixtega` first, then its
#      re-export `@pixtega/url` — via npm trusted publishing (OIDC, with
#      provenance). The tag minus the leading v must equal both
#      package.json versions, or the job fails before publishing. A
#      workspace whose exact version is already on the registry is
#      skipped instead of republished.
#   4. creates a GitHub Release with auto-generated notes (no CHANGELOG in
#      this repo) and the tarball + checksums attached.
#
# workflow_dispatch is a rehearsal: it builds the images and the binary
# and dry-runs the npm publish, but pushes no images, publishes no
# packages, and creates no release.
#
# Permissions and secrets: only the built-in GITHUB_TOKEN and a
# short-lived OIDC id-token are used.
#   - packages: write  (push to GHCR; the package inherits repo visibility,
#     so images on a private repo stay private)
#   - contents: write  (create the GitHub Release)
#   - id-token: write  (npm trusted publishing — no NPM_TOKEN secret; the
#     trusted publisher for both packages must point at this workflow
#     file on npmjs.com, otherwise the npm job fails closed)
# No extra repository secrets are required.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kroofy/pixtega

jobs:
  binary:
    name: release binary + checksums
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install libvips and AVIF encoder plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libheif-plugin-aomdec \
            libheif-plugin-aomenc \
            libvips-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball and checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then VERSION="rehearsal"; fi
          NAME="pixtega-${VERSION}-x86_64-unknown-linux-gnu-ubuntu26.04"
          mkdir -p "dist/${NAME}"
          cp target/release/pixtega LICENSE README.md THIRD_PARTY_NOTICES.md \
            config.example.toml "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  # One native build per architecture — an arm64 leg under QEMU on an x86
  # runner would multiply the Rust + libvips compile time. On a tag push
  # each leg pushes by digest (no tags yet); the manifest job below stitches
  # the digests into the tagged multi-arch manifest lists.
  image:
    name: image build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are applied by the manifest job; these steps only supply the
      # OCI labels baked into each per-arch image.
      - name: Image metadata (service)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Image metadata (lambda)
        id: meta-lambda
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false

      - name: Build service image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}

      - name: Build lambda image
        id: build-lambda
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.lambda
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-lambda.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}

      - name: Export image digests
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests/service /tmp/digests/lambda
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/service/${d#sha256:}"
          d="${{ steps.build-lambda.outputs.digest }}"
          touch "/tmp/digests/lambda/${d#sha256:}"

      - name: Upload digests
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/
          if-no-files-found: error

  manifest:
    name: multi-arch manifest lists
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (service)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest is added automatically on semver tags (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Image metadata (lambda)
        id: meta-lambda
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-lambda
            type=raw,value=lambda

      - name: Push service manifest list
        working-directory: /tmp/digests/service
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Push lambda manifest list
        working-directory: /tmp/digests/lambda
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta-lambda.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest lists
        run: |
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME#v}-lambda"

  npm:
    name: npm packages
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7

      # No npm cache here on purpose: release builds should not trust a
      # shared cache (the npm trusted-publishing docs say the same).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@11

      - run: npm ci

      - run: npm test

      - name: Check tag matches package versions
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for PKG in pixtega url; do
            PKG_VERSION="$(node -p "require('./${PKG}/package.json').version")"
            if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
              echo "js/${PKG} is ${PKG_VERSION} but the tag is v${TAG_VERSION}" >&2
              exit 1
            fi
          done

      - name: Pack and dry-run publish (rehearsal)
        if: github.event_name != 'push'
        run: |
          npm pack --workspace pixtega --workspace @pixtega/url
          npm publish --workspace pixtega --workspace @pixtega/url \
            --access public --dry-run

      # @pixtega/url depends on pixtega, so publish order matters.
      #
      # npm publish is not idempotent: republishing an existing version 403s.
      # @pixtega/url@0.1.1 was published outside CI to create the package so
      # a trusted publisher could be attached, so each publish first asks the
      # registry whether this exact name@version already exists and skips if
      # it does.
      - name: Publish pixtega
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "pixtega@${VERSION}" version \
                --registry=https://registry.npmjs.org 2>/dev/null)" = "${VERSION}" ]; then
            echo "pixtega@${VERSION} is already on npm, skipping"
          else
            npm publish --workspace pixtega --access public --provenance
          fi

      - name: Publish @pixtega/url
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "@pixtega/url@${VERSION}" version \
                --registry=https://registry.npmjs.org 2>/dev/null)" = "${VERSION}" ]; then
            echo "@pixtega/url@${VERSION} is already on npm, skipping"
          else
            npm publish --workspace @pixtega/url --access public --provenance
          fi

  release:
    name: GitHub Release
    needs: [binary, manifest, npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: release-binary
          path: dist

      # Image tags drop the leading v: tag v1.2.3 -> image 1.2.3.
      - name: Derive image version from the git tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Container images (multi-arch: linux/amd64, linux/arm64):

            - `ghcr.io/kroofy/pixtega:${{ env.VERSION }}` (also `latest`)
            - `ghcr.io/kroofy/pixtega:${{ env.VERSION }}-lambda` (also `lambda`) — AWS Lambda Web Adapter baked in

            npm packages (published from this tag):

            - [`pixtega@${{ env.VERSION }}`](https://www.npmjs.com/package/pixtega)
            - [`@pixtega/url@${{ env.VERSION }}`](https://www.npmjs.com/package/@pixtega/url)

            The attached binary is x86_64-only, dynamically linked against
            Ubuntu 26.04 libvips (`libvips42t64` + `libheif-plugin-aomenc`);
            the container image is the recommended distribution. Verify
            downloads with `sha256sum -c SHA256SUMS`.
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
