# Deploy the docs/homepage Worker (website/) to Cloudflare.
#
# Two jobs, two Workers, one script slot each (Workers free tier):
#
# - deploy — production Worker `pixtega` (pixtega.com). Runs on push to
#   main when website/** or this file changes, and on workflow_dispatch
#   (manual redeploy from the Actions tab). Never runs from PRs.
# - preview — ONE shared Worker `pixtega-preview` (not one Worker per
#   PR, which would burn a script slot per PR). Runs on pull_request
#   (opened/synchronize/reopened) touching the same paths, deploys the
#   PR's website/ with `--env preview` (the env in wrangler.jsonc names
#   the Worker and attaches custom domain preview.pixtega.com; prod
#   top-level config untouched), and keeps a sticky PR comment leading
#   with https://preview.pixtega.com (workers.dev URL as secondary).
#   Because the Worker is shared, the most recent deploy from ANY PR is
#   what is live: last deploy wins. The comment records PR number +
#   short SHA so it's clear which revision was deployed. Skipped for
#   PRs from forks — they cannot read the Cloudflare secrets.
#
# Wrangler 4 is current stable (4.125.x as of 2026-08-20). Pinned as
# wrangler@4 so CI tracks latest 4.x without jumping majors.
# Auth: Wrangler reads CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# from the environment
# (https://developers.cloudflare.com/workers/wrangler/system-environment-variables/).
# Add both as repo secrets before the first green deploy. Token needs
# Edit Cloudflare Workers (Workers Scripts:Edit).
#
# Custom domain pixtega.com is already attached to Worker `pixtega`
# in Cloudflare; these jobs only update the Workers.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy to Cloudflare (prod)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: wrangler deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --env "" targets the top-level (prod) environment explicitly;
        # without it wrangler warns because wrangler.jsonc now defines
        # a named `preview` environment too.
        run: npx --yes wrangler@4 deploy --env ""

  preview:
    name: PR preview (shared Worker)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    # Per-PR: a newer push to the same PR cancels the older deploy.
    # Cross-PR races are accepted — last deploy wins on the shared Worker.
    concurrency:
      group: website-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: wrangler deploy to shared preview Worker
        id: deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The primary preview URL is the fixed custom domain
        # preview.pixtega.com (attached by the env in wrangler.jsonc).
        # Also capture the workers.dev URL wrangler prints as a
        # secondary link; empty output if the print format ever changes
        # (the comment step then just omits it — no failing the job
        # after a good deploy).
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --env preview | tee deploy-output.txt
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy-output.txt | head -n 1 || true)
          echo "workers_dev_url=$url" >> "$GITHUB_OUTPUT"

      - name: sticky PR comment with preview URL
        uses: actions/github-script@v9
        env:
          WORKERS_DEV_URL: ${{ steps.deploy.outputs.workers_dev_url }}
        with:
          script: |
            const marker = '<!-- pixtega-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const workersDev = process.env.WORKERS_DEV_URL;
            const body = [
              marker,
              `**Docs preview** for PR #${context.issue.number} at \`${sha}\`: https://preview.pixtega.com`,
              ...(workersDev ? ['', `Also on workers.dev: ${workersDev}`] : []),
              '',
              'Shared preview Worker `pixtega-preview` — the most recent preview',
              'deploy from any PR is what is live (last deploy wins).',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
