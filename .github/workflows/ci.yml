# Fast correctness gate for every PR and every push to main.
#
# Three jobs:
#   check     - exactly ./scripts/check.sh (fmt --check, clippy -D warnings
#               which also denies rustc dead_code/unused lints, cargo-machete
#               unused-dependency scan, unit + integration tests) on the
#               toolchain pinned by rust-toolchain.toml. Runs twice: against
#               the libvips the images ship (scripts/build-libvips.sh, the
#               same recipe the Dockerfile runs) and against Ubuntu's own,
#               which local builds and the release tarball link.
#   audit     - cargo audit against Cargo.lock (known advisories on
#               production deps fail the job). Binary from
#               taiki-e/install-action, same as cargo-machete.
#   container - Docker build of both Dockerfile targets, the service image
#               and the Lambda image (buildx with GHA layer caching), then
#               ./scripts/container-acceptance.sh with PIXTEGA_SKIP_BUILD=1
#               (run each image, derive every format, stop it cleanly).
#
# Mutation testing is intentionally NOT here: a full cargo-mutants run takes
# hours and lives in .github/workflows/mutants.yml (cron + manual dispatch).
#
# ubuntu-26.04 is pinned (not ubuntu-latest) because its libvips 8.18
# matches the pinned libvips Rust bindings (=2.3.0) and its libheif ships
# the aom AV1 encoder plugin needed for AVIF output — the same reasoning as
# the Dockerfile base image.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt + clippy + tests (${{ matrix.libvips }} libvips)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        libvips: [image, ubuntu]
    steps:
      - uses: actions/checkout@v7

      # The libvips the container images ship, from the recipe the
      # Dockerfile runs. LIBRARY_PATH lets the linker find it in /usr/local.
      - name: Build the images' libvips
        if: matrix.libvips == 'image'
        run: |
          sudo ./scripts/build-libvips.sh
          echo "LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"

      - name: Install Ubuntu's libvips and AVIF encoder plugins
        if: matrix.libvips == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libheif-plugin-aomdec \
            libheif-plugin-aomenc \
            libvips-dev \
            pkg-config

      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      # with its pinned components (rustfmt, clippy). Same pattern as the
      # Dockerfile, so CI can never drift from the pin.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.libvips }}

      # Prebuilt binary so check.sh's `cargo machete` step (unused-dependency
      # gate) runs in CI exactly as it does locally.
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: check.sh (fmt, clippy, machete, tests)
        run: ./scripts/check.sh

      # The leg is only worth its name if the binary under test loads the
      # build it claims to.
      - name: Confirm the tests ran against the images' libvips
        if: matrix.libvips == 'image'
        run: ldd target/debug/pixtega | grep -F '/usr/local/lib/libvips.so.42'

  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # cargo-audit is a standalone binary; it reads Cargo.lock and does
      # not compile the crate, so no libvips, rust-toolchain, or rust-cache.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo-audit audit

  container:
    name: container acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the exact images the script would build, but through buildx
      # with GitHub Actions layer caching. The Dockerfile builds libvips and
      # compiles dependencies in layers keyed on scripts/build-libvips.sh
      # and Cargo.lock alone, so source-only changes reuse them and skip the
      # ~6-minute dependency compile. mode=max also caches the build-stage
      # layers (those layers live there); the default mode would cache only
      # the runtime stage.
      - name: Build service image with GHA layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: pixtega-acceptance:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same Dockerfile, `lambda` target: everything but the adapter layer
      # is already in the builder's cache from the step above.
      - name: Build Lambda image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: lambda
          tags: pixtega-acceptance:lambda
          load: true
          cache-from: type=gha

      # Acceptance script minus the builds: run each image, derive every
      # output format from every source format, stop it cleanly.
      - name: container-acceptance.sh
        run: PIXTEGA_SKIP_BUILD=1 ./scripts/container-acceptance.sh
