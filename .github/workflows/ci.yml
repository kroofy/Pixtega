# Fast correctness gate for every PR and every push to main.
#
# Two jobs:
#   check     - exactly ./scripts/check.sh (fmt --check, clippy -D warnings
#               which also denies rustc dead_code/unused lints, cargo-machete
#               unused-dependency scan, unit + integration tests) on the
#               toolchain pinned by rust-toolchain.toml.
#   container - Docker build of the repository Dockerfile (buildx with GHA
#               layer caching), then ./scripts/container-acceptance.sh with
#               PIXTEGA_SKIP_BUILD=1 (run image + curl smoke test).
#
# Mutation testing is intentionally NOT here: a full cargo-mutants run takes
# hours and lives in .github/workflows/mutants.yml (cron + manual dispatch).
#
# ubuntu-26.04 is pinned (not ubuntu-latest) because its libvips 8.18
# matches the pinned libvips Rust bindings (=2.3.0) and its libheif ships
# the aom AV1 encoder plugin needed for AVIF output — the same reasoning as
# the Dockerfile base image.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install libvips and AVIF encoder plugins
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libheif-plugin-aomdec \
            libheif-plugin-aomenc \
            libvips-dev \
            pkg-config

      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      # with its pinned components (rustfmt, clippy). Same pattern as the
      # Dockerfile, so CI can never drift from the pin.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Prebuilt binary so check.sh's `cargo machete` step (unused-dependency
      # gate) runs in CI exactly as it does locally.
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: check.sh (fmt, clippy, machete, tests)
        run: ./scripts/check.sh

  container:
    name: container acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the exact image the script would build, but through buildx with
      # GitHub Actions layer caching. The Dockerfile compiles dependencies in
      # a layer keyed on Cargo.lock alone, so source-only changes reuse the
      # cached dependency layer and skip the ~6-minute dependency compile.
      # mode=max also caches the build-stage layers (the dependency layer
      # lives there); the default mode would cache only the runtime stage.
      - name: Build image with GHA layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: pixtega-acceptance:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Acceptance script minus the build: run the image + curl smoke
      # asserting a 200 image/webp WebP body.
      - name: container-acceptance.sh
        run: PIXTEGA_SKIP_BUILD=1 ./scripts/container-acceptance.sh
