version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # js/ is the npm workspace (pixtega + @pixtega/url) with a real lockfile.
  # website/ deploys via `npx wrangler` and has no package.json.
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The Dockerfile's FROM lines: ubuntu and the Lambda Web Adapter image
  # (a named stage there so it is a FROM). Grouped so tag/digest churn lands
  # in one PR. The libvips source pin (VIPS_VERSION in
  # scripts/build-libvips.sh) is not something Dependabot can see;
  # docs/ci.md says how it is bumped.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
