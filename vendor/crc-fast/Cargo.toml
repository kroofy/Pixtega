[package]
name = "crc-fast"
version = "1.10.0"
edition = "2021"
rust-version = "1.89"
authors = ["Don MacAskill"]
license = "MIT OR Apache-2.0"
description = "Patched crc-fast 1.10.0: digest 0.11 so block-buffer 0.10.4 (GHSA-qwgh-2vcv-g2f7) is not pulled in."
repository = "https://github.com/awesomized/crc-fast-rust"
readme = "README.md"

[lib]
name = "crc_fast"
path = "src/lib.rs"

[dependencies]
digest = { version = "0.11", optional = true, default-features = false, features = ["alloc"] }
spin = { version = "0.10.0", default-features = false, features = [
    "once",
    "rwlock",
    "mutex",
    "spin_mutex",
], optional = true }
hashbrown = { version = "0.16.0", optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
spin = { version = "0.10.0", default-features = false, features = [
    "once",
    "rwlock",
    "mutex",
    "spin_mutex",
] }

[target.'cfg(target_arch = "x86")'.dependencies]
spin = { version = "0.10.0", default-features = false, features = [
    "once",
    "rwlock",
    "mutex",
    "spin_mutex",
] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
spin = { version = "0.10.0", default-features = false, features = [
    "once",
    "rwlock",
    "mutex",
    "spin_mutex",
] }

[features]
default = ["std", "panic-handler", "ffi"]
std = ["alloc"]
alloc = ["digest"]
panic-handler = []
ffi = []
cli = ["std"]
cache = ["alloc", "hashbrown", "spin"]
vpclmulqdq = []
optimize_crc32_auto = []
optimize_crc32_neon_eor3_v9s3x2e_s3 = []
optimize_crc32_neon_v12e_v1 = []
optimize_crc32_neon_v3s4x2e_v2 = []
optimize_crc32_neon_blended = []
optimize_crc32_avx512_vpclmulqdq_v3x2 = []
optimize_crc32_avx512_v4s3x3 = []
optimize_crc32_sse_v4s3x3 = []
